
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Rescue: AI Food Waste Advisor</title>
<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
line-height: 1.6;
color: #333;
max-width: 600px;
margin: 0 auto;
padding: 20px;
background-color: #f9f9f9;
}
.container {
background: #ffffff;
padding: 25px;
border-radius: 12px;
box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
h1 {
color: #2e7d32;
font-size: 24px;
margin-bottom: 5px;
text-align: center;
}
.subtitle {
color: #666;
font-size: 14px;
text-align: center;
margin-bottom: 25px;
}
.menu-title {
font-weight: bold;
margin-bottom: 10px;
color: #444;
}
.btn {
display: block;
width: 100%;
padding: 12px;
margin-bottom: 10px;
background-color: #e8f5e9;
color: #2e7d32;
border: 1px solid #c8e6c9;
border-radius: 8px;
cursor: pointer;
font-size: 15px;
font-weight: 600;
text-align: left;
transition: all 0.2s ease;
}
.btn:hover {
background-color: #c8e6c9;
}
#display {
border: 2px dashed #cccccc;
padding: 20px;
border-radius: 8px;
background: #fafafa;
min-height: 180px;
margin-top: 25px;
box-sizing: border-box;
}
.placeholder-text {
color: #999;
text-align: center;
margin-top: 60px;
}
.input-group {
display: flex;
margin-top: 15px;
gap: 8px;
}
input[type="text"] {
flex: 1;
padding: 10px;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 15px;
}
.action-btn {
padding: 10px 20px;
background-color: #2e7d32;
color: white;
border: none;
border-radius: 6px;
font-weight: bold;
cursor: pointer;
}
.result-box {
margin-top: 15px;
padding: 12px;
border-radius: 6px;
background-color: #f1f8e9;
border-left: 4px solid #7cb342;
}
.insight-box {
margin-top: 10px;
padding: 10px;
border-radius: 6px;
background-color: #e3f2fd;
border-left: 4px solid #1e88e5;
font-size: 14px;
}
.metrics-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
margin-top: 15px;
text-align: center;
}
.metric-card {
padding: 12px 5px;
border-radius: 8px;
}
</style>
</head>
<body>

<div class="container">
<h1>🌱 Smart Rescue</h1>
<div class="subtitle">AI Food Waste Advisor Panel Prototype</div>

<div class="menu-title">Select a Demo Feature to Pitch:</div>
<button class="btn" onclick="showRescue()">🚨 1. Emergency Ingredient Rescue</button>
<button class="btn" onclick="showRecipe()">🍳 2. Zero-Waste Recipe Generator</button>
<button class="btn" onclick="showMetrics()">📉 3. Live Impact Metrics</button>

<div id="display">
<div class="placeholder-text">Click a button above to run the live interaction screen.</div>
</div>
</div>

<!-- Connects the JavaScript logic file -->
<script src="script.js"></script>

</body>
</html>
